[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pypdf>=6.1,<7",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "mypy>=1.15,<2",
    "ruff>=0.11,<1",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.setuptools.package-data]
interview_backend = ["*.json", "*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/interview_backend"]

[tool.ruff]
target-version = "py311"
line-length = 100
